[package]
name = "calligrapher2"
version = "2.0.0"
edition = "2021"
description = "Original procedural calligraphy / handwriting generator, compiled to WebAssembly."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
# speed over size: the scan-look pixel loops run ~20-35% faster than with "z", for ~19 KB more wasm
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
