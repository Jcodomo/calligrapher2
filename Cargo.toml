[package]
name = "calligrapher2"
version = "2.0.0"
edition = "2021"
description = "Original procedural calligraphy / handwriting generator, compiled to WebAssembly."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
